version: 2

models:
  - name: rpt_monthly_revenue
    description: "Monthly revenue by country with MoM change, cumulative totals, and rankings. Answers: How is revenue trending month over month?"
    columns:
      - name: revenue_month
        tests:
          - not_null
      - name: ship_country
        tests:
          - not_null
      - name: monthly_revenue
        tests:
          - not_null
      - name: order_count
        tests:
          - not_null

  - name: rpt_customer_ltv
    description: "Customer lifetime value with LTV quartile buckets and global revenue rank. Answers: Who are the most valuable customers?"
    columns:
      - name: customer_sk
        tests:
          - not_null
          - unique
          - relationships:
              to: ref('dim_customers')
              field: customer_sk
      - name: company_name
        tests:
          - not_null
      - name: ltv_quartile
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: revenue_rank
        tests:
          - not_null

  - name: rpt_product_performance
    description: "Product revenue, units sold, and rankings — global and within category. Answers: Which products and categories perform best?"
    columns:
      - name: product_sk
        tests:
          - not_null
          - unique
      - name: product_name
        tests:
          - not_null
      - name: category_name
        tests:
          - not_null
      - name: net_revenue
        tests:
          - not_null
      - name: global_revenue_rank
        tests:
          - not_null

  - name: rpt_employee_sales
    description: "Employee sales performance with revenue rank, order count, and team share. Answers: Who are the top-performing sales reps?"
    columns:
      - name: employee_sk
        tests:
          - not_null
          - unique
      - name: full_name
        tests:
          - not_null
      - name: revenue_rank
        tests:
          - not_null

  - name: rpt_shipping_delays
    description: "On-time delivery rate by country with freight costs and speed rankings. Answers: Which countries and shippers have the worst delivery performance?"
    columns:
      - name: ship_country
        tests:
          - not_null
          - unique
      - name: on_time_pct
        tests:
          - not_null
      - name: total_orders
        tests:
          - not_null

  - name: rpt_shipper_performance
    description: "On-time delivery rate and delay ranking per shipping carrier. Answers: Which shipper has the most delays?"
    columns:
      - name: shipper_id
        description: "Numeric identifier for the shipping carrier."
        tests:
          - not_null
      - name: shipper_name
        description: "Company name of the shipping carrier."
      - name: total_orders
        description: "Total number of orders handled by this shipper."
      - name: on_time_orders
        description: "Count of orders delivered on or before the required date."
      - name: late_orders
        description: "Count of orders delivered after the required date."
      - name: on_time_pct
        description: "Percentage of orders delivered on time (0–100)."
      - name: avg_days_to_ship
        description: "Average days from order date to ship date for this shipper."
      - name: worst_on_time_rank
        description: "Rank by ascending on-time percentage; rank 1 = worst-performing shipper."
        tests:
          - not_null
